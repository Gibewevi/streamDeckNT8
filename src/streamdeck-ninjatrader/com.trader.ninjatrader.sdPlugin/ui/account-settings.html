<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Account Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; color: #ccc; background: #2d2d2d; margin: 0; padding: 12px; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; color: #999; font-size: 11px; text-transform: uppercase; }
    textarea { width: 100%; min-height: 72px; box-sizing: border-box; padding: 6px 8px; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 12px; resize: vertical; }
    textarea:focus { border-color: #0078d4; outline: none; }
    .hint { font-size: 10px; color: #666; margin-top: 2px; line-height: 1.35; }
    h3 { color: #fff; font-size: 13px; margin: 0 0 12px 0; border-bottom: 1px solid #444; padding-bottom: 8px; }
  </style>
</head>
<body>
  <h3>Account Selector</h3>

  <div class="field">
    <label>Accounts</label>
    <textarea id="accounts" placeholder="Leave empty to use active NinjaTrader accounts"></textarea>
    <div class="hint">Optional. Separate accounts with commas or new lines to reorder/filter active accounts only.</div>
  </div>

  <script>
    const $accounts = document.getElementById('accounts');

    window.addEventListener('message', (event) => {
      if (event.data && event.data.type === 'loadSettings') {
        const s = event.data.settings || {};
        if (s.accounts) $accounts.value = s.accounts;
      }
    });

    function save() {
      window.parent.postMessage({
        type: 'saveSettings',
        settings: {
          accounts: $accounts.value || undefined,
        },
      }, '*');
    }

    $accounts.addEventListener('change', save);
  </script>
</body>
</html>
