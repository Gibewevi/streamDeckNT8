<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Status Display Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; color: #ccc; background: #2d2d2d; margin: 0; padding: 12px; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; color: #999; font-size: 11px; text-transform: uppercase; }
    select { width: 100%; box-sizing: border-box; padding: 6px 8px; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 12px; }
    select:focus { border-color: #0078d4; outline: none; }
    .hint { font-size: 10px; color: #666; margin-top: 2px; }
    h3 { color: #fff; font-size: 13px; margin: 0 0 12px 0; border-bottom: 1px solid #444; padding-bottom: 8px; }
  </style>
</head>
<body>
  <h3>Status Display</h3>

  <div class="field">
    <label>Display Type</label>
    <select id="statusType">
      <option value="account">Account Name</option>
      <option value="instrument">Active Instrument</option>
      <option value="position">Position Info</option>
      <option value="pnl">Unrealized P&L</option>
      <option value="quantity">Current Quantity</option>
      <option value="connection">Connection Status</option>
    </select>
    <div class="hint">What this button displays</div>
  </div>

  <script>
    const $type = document.getElementById('statusType');

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'loadSettings') {
        const s = event.data.settings || {};
        if (s.statusType) $type.value = s.statusType;
      }
    });

    $type.addEventListener('change', () => {
      window.parent.postMessage({
        type: 'saveSettings',
        settings: { statusType: $type.value }
      }, '*');
    });
  </script>
</body>
</html>
