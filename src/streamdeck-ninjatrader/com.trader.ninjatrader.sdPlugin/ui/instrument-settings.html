<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Instrument Settings</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 12px; color: #ccc; background: #2d2d2d; margin: 0; padding: 12px; }
    .field { margin-bottom: 12px; }
    label { display: block; margin-bottom: 4px; color: #999; font-size: 11px; text-transform: uppercase; }
    input { width: 100%; box-sizing: border-box; padding: 6px 8px; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 4px; font-size: 12px; }
    input:focus { border-color: #0078d4; outline: none; }
    .hint { font-size: 10px; color: #666; margin-top: 2px; }
    h3 { color: #fff; font-size: 13px; margin: 0 0 12px 0; border-bottom: 1px solid #444; padding-bottom: 8px; }
  </style>
</head>
<body>
  <h3>Instrument Settings</h3>

  <div class="field">
    <label>Instrument Name</label>
    <input type="text" id="instrument" value="ES 06-25" />
    <div class="hint">Full NinjaTrader instrument name (e.g. "ES 06-25", "NQ 06-25")</div>
  </div>

  <div class="field">
    <label>Display Label</label>
    <input type="text" id="displayLabel" value="ES" />
    <div class="hint">Short label shown on the button</div>
  </div>

  <script>
    const $instrument = document.getElementById('instrument');
    const $label = document.getElementById('displayLabel');

    window.addEventListener('message', (event) => {
      if (event.data?.type === 'loadSettings') {
        const s = event.data.settings || {};
        if (s.instrument) $instrument.value = s.instrument;
        if (s.displayLabel) $label.value = s.displayLabel;
      }
    });

    function save() {
      window.parent.postMessage({
        type: 'saveSettings',
        settings: {
          instrument: $instrument.value,
          displayLabel: $label.value,
        }
      }, '*');
    }

    $instrument.addEventListener('change', save);
    $label.addEventListener('change', save);
  </script>
</body>
</html>
